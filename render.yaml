services:
  - type: web
    name: hermes-telegram-agent
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_USERS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-2.5-flash
